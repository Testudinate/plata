version: 2

models:
  - name: cor_canonical_dbt
    description: >
      Канонический COR по продукту и месяцу выписки. Единственный разрешённый способ
      считать метрику в слое трансформаций; контракт - COR_PCT_CC v1.0 из
      RISK_GOV.META.METRIC_DEFINITIONS.
    columns:
      - name: product_risks
        description: "Продукт. В DM.* фильтр называется product_risks, в TABLEAU.* - account_type."
        tests:
          - not_null
          - accepted_values:
              values: ['CC', 'GRZD_CLIPPED']
      - name: stmt_month
        description: "Месяц выписки, начало месяца."
        tests: [not_null]
      - name: cor_pct_annual
        description: "Аннуализированный COR в процентах, знак приведён к положительному."
        tests: [not_null]

exposures:
  - name: risk_copilot_agent
    type: application
    maturity: medium
    url: https://app.snowflake.com
    description: >
      LLM-агент RISK_GOV.AGENT.RISK_COPILOT. Потребляет канон через семантическую вью
      SV_COR. Ломающее изменение зерна или формулы обязано пройти через реестр
      потребителей RISK_GOV.META.CONSUMER_REGISTRY до релиза.
    depends_on:
      - ref('cor_canonical_dbt')
    owner:
      name: Risk Data Governance Lead
      email: risk-governance@plata.example

  - name: tableau_cor_dashboard
    type: dashboard
    maturity: high
    description: >
      Дашборд COR в Tableau. Уведомление за 10 рабочих дней до ломающего изменения.
    depends_on:
      - ref('cor_canonical_dbt')
    owner:
      name: BI team
      email: bi@plata.example
